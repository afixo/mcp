name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json#packageManager
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The committed worker-configuration.d.ts must match wrangler.jsonc (run `pnpm types` after config changes).
      - run: pnpm wrangler types --strict-vars=false --check

      - run: pnpm typecheck

      - run: pnpm test

      # Bundles the Worker exactly as a deploy would, without credentials.
      - run: pnpm wrangler deploy --dry-run --outdir dist
